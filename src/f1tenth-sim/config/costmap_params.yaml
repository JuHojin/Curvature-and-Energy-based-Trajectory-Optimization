global_frame: map
robot_base_frame: base_link
update_frequency: 5.0  # Increase for more frequent updates
publish_frequency: 2.0  # Increase to improve visualization responsiveness in RViz
resolution: 0.05  # A finer resolution for more detailed mapping
rolling_window: false  # Enable if the costmap should move with the robot (useful for large or dynamic spaces)

plugins:
  - {name: static_layer, type: "costmap_2d::StaticLayer"}
  - {name: obstacles, type: "costmap_2d::VoxelLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

static_layer:
  track_unknown_space: true  # Track unknown space as obstacles

obstacles_layer:
  enabled: true
  obstacle_range: 2.5  # Maximum range to consider an object as an obstacle
  raytrace_range: 3.0  # Distance for raytracing to clear obstacles
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: /car_1/scan
    marking: true
    clearing: true

inflation_layer:
  inflation_radius: 1.0  # Increase radius for a safer buffer around obstacles
  cost_scaling_factor: 10.0  # Increase the scaling factor to make the cost propagate further
